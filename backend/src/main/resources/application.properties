server.port=7080
spring.application.name=birthday-backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB

# Origens liberadas para o frontend durante o desenvolvimento local.
app.cors.allowed-origins=${ttp://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8087,http://localhost:5173,http://127.0.0.1:5173}
